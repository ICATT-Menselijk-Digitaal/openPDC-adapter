description:
  en:
    localisedName: " openPDC-adapter"
    shortDescription: Inserts  "Products and Services catalog" (Producten en
      Diensten Catalogus) items into KISS search (the Open Object register).
    longDescription: >-
      openPDC-adapter for retrieving items from a "Products and Services
      catalog" (Producten en Diensten Catalogus) and syncing them into the Open
      Object register.


      This adapter is a generic standalone application, developed for the
      municipality Rheden to make their Products and Services catalog directly
      available in KISS (https://www.kiss-klantcontact.nl/). The openPDC-adapter
      fetches products from the WordPress REST API and syncs them as SDG
      Kennisartikelen into Open Objects.
    documentation: https://github.com/ICATT-Menselijk-Digitaal/openPDC-adapter
    features:
      - Makes JSON/HTTPS API calls
